<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" role="img" aria-label="Cross-section of an upper front tooth: toothbrush bristles tilted at 45 degrees towards the gum, with the tips at the gum line">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fbf8f3"/><stop offset="1" stop-color="#ece5da"/>
    </radialGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#f7f4ee"/><stop offset="1" stop-color="#e4ddd0"/>
    </linearGradient>
    <linearGradient id="dentin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6e7c4"/><stop offset=".5" stop-color="#f1dfb6"/><stop offset="1" stop-color="#e2cb98"/>
    </linearGradient>
    <linearGradient id="gum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9787a"/><stop offset=".6" stop-color="#ea9a98"/><stop offset="1" stop-color="#e48c8b"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe3c9"/><stop offset="1" stop-color="#e3d3b0"/>
    </linearGradient>
    <pattern id="trab" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#d8c59c" opacity=".55"/><circle cx="11" cy="10" r="1.6" fill="#d8c59c" opacity=".45"/>
    </pattern>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5378"/><stop offset=".5" stop-color="#143550"/><stop offset="1" stop-color="#0b2236"/>
    </linearGradient>
    <linearGradient id="bristle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc3e6"/><stop offset="1" stop-color="#5f93c4"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5a4630" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#bg)"/>

  <!-- jaw block: bone with gum covering, upper jaw (root points up) -->
  <g filter="url(#sh)">
    <!-- bone -->
    <path d="M170 20 H430 C440 60 446 120 440 170 C436 190 400 196 352 205 L340 120 C335 80 315 52 300 46 C285 52 265 80 260 120 L248 205 C200 196 164 190 160 170 C154 120 160 60 170 20 Z" fill="url(#bone)"/>
    <path d="M170 20 H430 C440 60 446 120 440 170 C436 190 400 196 352 205 L340 120 C335 80 315 52 300 46 C285 52 265 80 260 120 L248 205 C200 196 164 190 160 170 C154 120 160 60 170 20 Z" fill="url(#trab)"/>
    <!-- cortical outline -->
    <path d="M170 20 H430 C440 60 446 120 440 170 C436 190 400 196 352 205 L340 120 C335 80 315 52 300 46 C285 52 265 80 260 120 L248 205 C200 196 164 190 160 170 C154 120 160 60 170 20 Z" fill="none" stroke="#cdb88d" stroke-width="2"/>

    <!-- tooth: root (dentin) + crown (enamel), upper incisor, labial side on the left -->
    <path d="M300 48 C318 56 334 92 338 140 L344 222 C346 262 338 300 318 356 C314 366 304 370 298 364 C280 314 258 280 258 230 L262 140 C266 92 282 56 300 48 Z" fill="url(#dentin)" stroke="#cbb07a" stroke-width="1.5"/>
    <!-- enamel cap on crown -->
    <path d="M258 226 C258 270 280 314 298 364 C304 370 314 366 318 356 C338 300 346 262 344 222 C336 236 322 240 300 240 C280 240 266 236 258 226 Z" fill="url(#enamel)" stroke="#d6cdbd" stroke-width="1.5"/>
    <!-- pulp and canal -->
    <path d="M300 62 C304 90 308 140 310 200 C311 240 306 280 300 300 C294 280 290 240 291 200 C292 140 296 90 300 62 Z" fill="#e9a3a0" opacity=".85"/>

    <!-- gum: covers the bone, hugs the tooth neck with a scalloped margin -->
    <!-- labial (left) gum -->
    <path d="M157 140 C160 172 196 184 246 190 C252 200 254 210 258 218 L262 226 C254 230 238 228 222 224 C196 218 168 208 160 192 C156 176 155 158 157 140 Z" fill="url(#gum)"/>
    <!-- palatal (right) gum -->
    <path d="M443 140 C440 172 404 184 354 190 C348 200 346 210 344 216 L342 224 C350 228 364 226 378 222 C404 216 432 206 440 192 C444 176 445 158 443 140 Z" fill="url(#gum)"/>
    <!-- sulcus hint (tiny gap at the labial margin) -->
    <path d="M259.5 208 L260.5 224" stroke="#b85b5e" stroke-width="1.2" opacity=".7"/>
  </g>

  <!-- tooth long axis -->
  <path d="M261 214 L261 120" stroke="#6b645c" stroke-width="1.4" stroke-dasharray="4 4"/>
  <!-- bristle direction guide -->
  <path d="M261 214 L314 161" stroke="#6b645c" stroke-width="1.4" stroke-dasharray="4 4"/>
  <!-- 45 degree arc -->
  <path d="M261 170 A44 44 0 0 1 292 183" fill="none" stroke="#a5876a" stroke-width="2"/>
  <text x="270" y="160" font-family="Georgia,serif" font-size="18" fill="#8a6b4e">45°</text>

  <!-- toothbrush head on the labial side; bristles tilted 45° up into the gum line -->
  <g filter="url(#sh)">
    <!-- bristle tufts: tips touch the gum line and tooth neck -->
    <g stroke="url(#bristle)" stroke-linecap="round">
      <line x1="218.0" y1="250.0" x2="259.5" y2="208.5" stroke-width="3.6"/>
      <line x1="223.0" y1="255.0" x2="260.2" y2="217.8" stroke-width="3.6"/>
      <line x1="228.0" y1="260.0" x2="261.0" y2="227.0" stroke-width="3.6"/>
      <line x1="233.0" y1="265.0" x2="261.8" y2="236.2" stroke-width="3.6"/>
      <line x1="238.0" y1="270.0" x2="262.5" y2="245.5" stroke-width="3.6"/>
      <line x1="243.0" y1="275.0" x2="263.2" y2="254.8" stroke-width="3.6"/>
      <line x1="248.0" y1="280.0" x2="264.0" y2="264.0" stroke-width="3.6"/>
      <line x1="253.0" y1="285.0" x2="264.8" y2="273.2" stroke-width="3.6"/>
      <line x1="258.0" y1="290.0" x2="265.5" y2="282.5" stroke-width="3.6"/>
    </g>
    <!-- head and neck -->
    <rect x="180" y="258" width="104" height="22" rx="11" fill="url(#head)" transform="rotate(45 232 269)"/>
    <rect x="190" y="261" width="84" height="4" rx="2" fill="#ffffff" opacity=".25" transform="rotate(45 232 269)"/>
  </g>

  <!-- cleaning zone glow at the gum line -->
  <circle cx="261" cy="220" r="15" fill="#7fa8d1" opacity=".18"/>
</svg>
